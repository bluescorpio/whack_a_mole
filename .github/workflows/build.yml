name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pygame pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --add-data "assets;assets" --icon icon.ico main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: whack-a-mole-windows
          path: dist/main.exe
          if-no-files-found: error
